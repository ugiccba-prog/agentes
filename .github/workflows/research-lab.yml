name: Research lab checks
on:
  push:
    branches:
      - feature/laboratorio-investigacion-20261120
  workflow_dispatch:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  isolated-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install research dependencies
        run: python -m pip install pandas numpy requests urllib3
      - name: Compile research modules
        run: python -m compileall -q research exchange_connector.py walk_forward.py
      - name: Run isolated research tests
        run: python -m unittest discover -s tests -p 'test_research*.py' -v
  manual-research:
    if: github.event_name == 'workflow_dispatch'
    needs: isolated-tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install research dependencies
        run: python -m pip install pandas numpy requests urllib3
      - name: Fetch closed public candles
        run: python -m research.fetch_candles --symbol BTCUSDT --interval 15m --output research_data/BTCUSDT.csv
      - name: Generate experimental report
        run: python -m research.nightly --csv research_data/BTCUSDT.csv --output research_reports/scan.json --max-candidates 7
      - name: Create plain-Spanish report
        run: python -m research.report research_reports/scan.json --output research_reports/scan.md
      - name: Upload research artifact
        uses: actions/upload-artifact@v4
        with:
          name: tiburon-experimental-research
          path: |
            research_reports/scan.json
            research_reports/scan.md
          retention-days: 7

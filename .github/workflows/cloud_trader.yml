name: Agente Trading 24/7 en la Nube

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: trading-agent-cloud
  cancel-in-progress: false

jobs:
  trade-in-cloud:
    runs-on: ubuntu-latest
    timeout-minutes: 260
    steps:
      - name: Descargar repositorio y cartera actual
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependencias cuantitativas
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy requests urllib3

      - name: Ejecutar Agente en Vivo en la Nube (4 horas continuas con actualización en vivo del README)
        run: |
          python -u cloud_runner.py --minutes 240 --tick 60 --sync-every 3

      - name: Auto-Encadenar Siguiente Sesión 24/7 sin pausa
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run cloud_trader.yml --ref main || true
